<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Abiade Font Preview</title>
  <style>
    @font-face {
      font-family: "Abiade";
      src: url("./Abiade-Regular.woff2") format("woff2"), url("./Abiade-Regular.ttf") format("truetype");
      font-weight: 400;
      font-style: normal;
      font-display: block;
    }
    body {
      margin: 0;
      padding: 40px;
      background: #111;
      color: #f7f1e3;
      font-family: system-ui, sans-serif;
    }
    h1 {
      margin: 0 0 24px;
      font-family: system-ui, sans-serif;
      font-size: 18px;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }
    .specimen {
      font-family: "Abiade", system-ui, sans-serif;
      font-size: clamp(34px, 7vw, 92px);
      line-height: 1.35;
      letter-spacing: 0;
      font-kerning: normal;
    }
  </style>
</head>
<body>
  <h1>Abiade Regular Preview</h1>
  <main class="specimen">
    <div>ABCDEFGHIJKLMNOPQRSTUVWXYZ</div>
    <div>abcdefghijklmnopqrstuvwxyz</div>
    <div>ABIADE</div>
    <div>Abiade</div>
    <div>ABÍÁDÉ</div>
    <div>Á É Í AÁ EÉ IÍ</div>
    <div>ABI ADE ABIADE</div>
    <div>AV AW AY AT VA WA YA TA</div>
    <div>FA PA RA LT LY LV</div>
    <div>AIA IAI BIB DED</div>
    <div>D O P Q R A B</div>
  </main>
</body>
</html>
